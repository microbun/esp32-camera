[env:goouuu-s3-cam]
platform = platformio/espressif32@6.12.0
board = goouuu-esp32-s3-cam
framework = espidf

; GOOUUU ESP32-S3-CAM N16R8: quad Flash, octal PSRAM.
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800

; Use the TTL connector for logs. OTG becomes a UVC camera after boot.
; Set upload_port / monitor_port only if automatic detection picks the wrong port.
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
